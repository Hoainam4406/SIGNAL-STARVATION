experiment:
  name: signal_starvation_baseline
  seed: 42
  algorithm: PPO
  dataset: navsim_mini
  robot: differential_drive
  reward_type: sparse
  level_filter: all
training:
  total_timesteps: 100000
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
evaluation:
  eval_freq: 5000
  n_eval_episodes: 20
  timeout_steps: 500
logging:
  use_tensorboard: true
  save_interval: 10000
