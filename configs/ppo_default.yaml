# Schulman et al. (2017) — Proximal Policy Optimization Algorithms (arXiv:1707.06347)
# On-policy clipped surrogate objective optimized for discrete robot navigation
algorithm: ppo
policy: MlpPolicy
learning_rate: 3.0e-4
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01       # > 0 để khuyến khích exploration với sparse reward
vf_coef: 0.5
max_grad_norm: 0.5
device: auto
